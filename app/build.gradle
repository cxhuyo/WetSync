plugins {
    id 'com.android.application'
}

// 可选的自定义签名：在仓库根目录放 keystore.properties（已在 .gitignore 里排除）即可启用，
// 不存在时回退到 debug 签名，保证 fork 下来直接 assembleRelease 也能装。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.cxhuyo.wetsync'

    // libxposed api:102.0.0 的 AAR 清单要求 minCompiledSdkVersion=37，compileSdk 35 会直接编译失败。
    // 若本机 SDK 把 android-37 注册成扩展平台（package.xml 里 path=platforms;android-37.0），
    // 整数 compileSdk 37 会报 Failed to find Platform SDK，需把该 path 改回 platforms;android-37。
    compileSdk 37

    defaultConfig {
        applicationId 'com.cxhuyo.wetsync'
        minSdk 28
        targetSdk 35
        versionCode 54
        versionName '3.20.1'
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 没配 keystore.properties 时用 debug 签名：功能与自签名一致，
            // 只是不能用于 Play 上架，也不适合作为长期分发签名。
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 模块页要显示版本号；BuildConfig 与 versionName/versionCode 同源，
        // 比在 Java 里再抄一份常量可靠（AGP 8 起需显式开启）。
        buildConfig true
    }

    lint {
        // 这个模块大量使用反射与隐藏 API，lint 的 NewApi / DiscouragedApi 噪声没有参考价值。
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // libxposed API 102（compileOnly：运行时由 LSPosed 2.1.x 框架提供）
    compileOnly 'io.github.libxposed:api:102.0.0'
    // 模块 ↔ 管理器服务（作用域查询/申请）：必须打进 APK，模块主页要用
    implementation 'io.github.libxposed:service:102.0.0'
    compileOnly 'androidx.annotation:annotation:1.9.1'

    // 注意：不要再引入任何 androidx.* 运行期依赖。
    // 宿主的 androidx 被 R8 重名化（FragmentManager 实际类名是 androidx.fragment.app.E），
    // 且模块 ClassLoader 只有自身 dex，运行期按原名加载 androidx 类必然 NoClassDefFoundError。
    // 凡是需要用到宿主类，一律在运行时用 classLoader 反射获取。
}
